name: ECOAGENT verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/*.test.mjs cloud/*.test.mjs connector/*.test.mjs gateway/*.test.mjs
      - run: |
          node --check cloud/app.mjs
          node --check cloud/ui.js
          node --check extension/popup.js
          node --check bridge.mjs
          node --check server.mjs
          node --check connector/remote.mjs
          node --check connector/tools.mjs
          node --check gateway/server.mjs
          node --check gateway/check-config.mjs

      - name: Install connector and audit
        working-directory: connector
        run: |
          npm install --ignore-scripts
          npm audit --omit=dev --audit-level=high
          node sdk.integration.mjs
          node http.integration.mjs
          node desktop.integration.mjs
      - name: Install browser and execute offline form integration
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
          ECOAGENT_TEST_DIAGNOSTICS=1 PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" node connector/desktop.integration.mjs --fixture
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell source
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem -Path . -Recurse -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { $bad += $errors; Write-Host $_.FullName; $errors | Out-String | Write-Host }
          }
          if ($bad.Count) { throw 'PowerShell syntax validation failed' }
